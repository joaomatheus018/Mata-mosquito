<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Mata Mosquito</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ========================= -->
    <!-- LOBBY -->
    <!-- ========================= -->

    <main id="lobby-screen">

        <section class="lobby-card">

            <div class="hand-icon">
                ✋
            </div>

            <h1>MATA MOSQUITO</h1>

            <p class="subtitle">
                Escolha como você quer jogar
            </p>

            <div class="input-group">

                <label for="player-name">
                    SEU APELIDO
                </label>

                <input
                    type="text"
                    id="player-name"
                    maxlength="16"
                    placeholder="Ex: Player1"
                    autocomplete="off">

            </div>

            <div class="mode-title">
                MODO DE CONTROLE
            </div>

            <div class="mode-selection">

                <button
                    id="mouse-mode"
                    class="mode-card selected"
                    type="button"
                    onclick="selecionarModo('mouse')">

                    <span class="mode-icon">
                        🖱️
                    </span>

                    <span class="mode-name">
                        MOUSE
                    </span>

                    <span class="mode-description">
                        Clique no mosquito
                    </span>

                </button>

                <button
                    id="hand-mode"
                    class="mode-card"
                    type="button"
                    onclick="selecionarModo('mao')">

                    <span class="mode-icon">
                        ✋
                    </span>

                    <span class="mode-name">
                        MÃO
                    </span>

                    <span class="mode-description">
                        Feche a mão para pegar
                    </span>

                </button>

            </div>

            <button
                id="btn-jogar"
                type="button"
                onclick="jogar()">

                <span>▶</span>
                JOGAR AGORA

            </button>

            <section class="ranking">

                <div class="ranking-header">

                    <div>
                        🏆 TOP CAÇADORES
                    </div>

                    <span>
                        ONLINE
                    </span>

                </div>

                <div id="ranking-list">

                    <div class="ranking-loading">
                        Carregando ranking...
                    </div>

                </div>

            </section>

        </section>

    </main>


    <!-- ========================= -->
    <!-- JOGO -->
    <!-- ========================= -->

    <main
        id="game-screen"
        class="hidden">

        <div id="hud">

            <div class="hud-item">
                ❤️
                <span id="lives-display">
                    ❤️❤️❤️
                </span>
            </div>

            <div class="hud-item">
                PONTOS:
                <strong id="score-display">
                    0
                </strong>
            </div>

            <div class="hud-item">
                RECORDE:
                <strong id="highscore-display">
                    0
                </strong>
            </div>

            <div class="hud-item">
                NÍVEL:
                <strong id="level-display">
                    1
                </strong>
            </div>

            <div class="hud-item">
                TEMPO:
                <strong id="time-display">
                    60
                </strong>
            </div>

        </div>


        <div id="game-area"></div>


        <!-- CÂMERA -->

        <div
            id="camera-container"
            class="hidden">

            <video
                id="camera-video"
                autoplay
                muted
                playsinline>
            </video>

            <div id="hand-status">
                ✋ Mostre sua mão
            </div>

        </div>


        <!-- CURSOR DA MÃO -->

        <div
            id="hand-cursor"
            class="hidden">

            <span>
                ✋
            </span>

        </div>


        <!-- GAME OVER -->

        <div
            id="game-overlay"
            class="overlay hidden">

            <div class="overlay-card">

                <div class="overlay-icon">
                    🦟
                </div>

                <h2 id="overlay-title">
                    GAME OVER
                </h2>

                <p id="overlay-msg">
                    Você perdeu!
                </p>

                <div class="final-score">

                    <span>
                        SUA PONTUAÇÃO
                    </span>

                    <strong id="final-score">
                        0
                    </strong>

                </div>

                <div
                    id="record-message"
                    class="record-message hidden">

                    🏆 NOVO RECORDE!

                </div>

                <button
                    onclick="reiniciarJogo()">

                    🔄 JOGAR NOVAMENTE

                </button>

                <button
                    class="secondary-button"
                    onclick="voltarAoMenu()">

                    ← VOLTAR AO MENU

                </button>

            </div>

        </div>


        <button
            id="btn-sair"
            onclick="voltarAoMenu()">

            ✕ MENU

        </button>

    </main>


    <!-- ========================= -->
    <!-- MEDIAPIPE -->
    <!-- ========================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
        crossorigin="anonymous">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
        crossorigin="anonymous">
    </script>


    <!-- ========================= -->
    <!-- FIREBASE -->
    <!-- ========================= -->

    <script
        src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js">
    </script>

    <script
        src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js">
    </script>


    <!-- ========================= -->
    <!-- SEUS JS -->
    <!-- ========================= -->

    <script src="js/config.js"></script>
    <script src="js/game.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
